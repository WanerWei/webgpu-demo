<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TF.js 本地图片上传分类（无跨域）</title>
    <style>
        .container { max-width: 500px; margin: 20px auto; }
        #preview { width: 224px; height: 224px; border: 1px dashed #ccc; margin: 10px 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #preview img { width: 100%; height: 100%; object-fit: cover; }
        #upload { margin: 10px 0; }
        #classifyBtn { padding: 8px 20px; cursor: pointer; margin: 10px 0; background: #409eff; color: white; border: none; border-radius: 4px; }
        #classifyBtn:disabled { background: #ccc; cursor: not-allowed; }
        #result { margin-top: 10px; padding: 10px; border: 1px solid #eee; border-radius: 4px; }
    </style>
    <!-- 引入TF.js核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
    <!-- 引入MobileNet模型库 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
</head>
<body>
    <div class="container">
        <h3>TF.js 本地图片上传分类</h3>
        <!-- 图片上传控件 -->
        <input type="file" id="upload" accept="image/*">
        <!-- 图片预览区域 -->
        <div id="preview">
            <span>未选择图片</span>
        </div>
        <!-- 分类按钮（默认禁用） -->
        <button id="classifyBtn" disabled>开始分类</button>
        <!-- 分类结果展示 -->
        <div id="result"></div>
    </div>

    <script>
        // 全局变量
        let selectedImage = null; // 存储选中的图片对象
        let mobilenetModel = null; // 缓存加载的模型

        // 初始化：提前加载模型（提升首次分类速度）
        async function initModel() {
            const resultEl = document.getElementById('result');
            resultEl.innerText = "正在加载AI分类模型（首次加载约17MB，自动缓存）...";
            try {
                mobilenetModel = await mobilenet.load();
                resultEl.innerText = "模型加载完成，请上传图片进行分类";
            } catch (err) {
                resultEl.innerText = `模型加载失败：${err.message}`;
                console.error("模型加载错误：", err);
            }
        }

        // 监听图片上传：预览并启用分类按钮
        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) {
                alert("请选择有效的图片文件！");
                return;
            }

            // 生成图片预览URL
            const reader = new FileReader();
            reader.onload = function(event) {
                const previewEl = document.getElementById('preview');
                previewEl.innerHTML = `<img src="${event.target.result}" alt="预览图片">`;
                selectedImage = new Image();
                selectedImage.src = event.target.result;
                // 启用分类按钮
                document.getElementById('classifyBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        });

        // 分类逻辑
        document.getElementById('classifyBtn').addEventListener('click', async function() {
            const resultEl = document.getElementById('result');
            if (!selectedImage || !mobilenetModel) {
                resultEl.innerText = "请先上传图片或等待模型加载完成！";
                return;
            }

            resultEl.innerText = "正在分析图片...";
            try {
                // 执行图像分类
                const predictions = await mobilenetModel.classify(selectedImage);
                // 取置信度最高的结果
                const topPred = predictions[0];
                // 格式化结果（中文展示更友好）
                resultEl.innerHTML = `
                    <strong>分类结果：</strong>${topPred.className}<br>
                    <strong>置信度：</strong>${(topPred.probability * 100).toFixed(2)}%<br>
                    <strong>底层加速：</strong>${tf.getBackend()}（自动适配GPU/CPU）
                `;
            } catch (err) {
                resultEl.innerText = `分类失败：${err.message}`;
                console.error("分类错误详情：", err);
            }
        });

        // 页面加载完成后初始化模型
        window.onload = initModel;
    </script>
</body>
</html>
